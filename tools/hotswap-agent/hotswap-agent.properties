# HotswapAgent 配置
# 放在与 hotswap-agent.jar 同目录，或 classpath 根目录

# 自动热重载（IDE 构建后自动加载新 class）
autoHotswap=true

# 监听 resources 目录变化（如 META-INF/services）
watchResources=true

# 不启用与 Minecraft 无关的插件，减少干扰
disabledPlugins=spring,spring-boot,log4j2,logback,hibernate,mybatis

# 日志级别：INFO 输出热重载信息
pluginLogLevel=INFO
